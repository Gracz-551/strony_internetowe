<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <!-- TODO: dodaj przycisk zwiększający licznik -->
             <button onclick="addPoint()">+1</button>
             <button onclick="resetCounter()">reset</button>
             
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <!-- TODO: dodaj przycisk uruchamiający losowanie -->
             <button onclick="losowanie()">Losuj</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <!-- TODO: osadź zewnętrzny widget za pomocą iframe -->
             <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624130.406361161!2d15.602295987500005!3d50.03707820000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4716476deacda103%3A0x1b727867bd8171bd!2sGiganci%20Niepo%C5%82omice%20-%20Nauka%20nowych%20technologii%20dla%20Dzieci%20i%20M%C5%82odzie%C5%BCy!5e0!3m2!1spl!2spl!4v1794942309073!5m2!1spl!2spl" width="250" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
